# Three-level hierarchy with sizes and latencies in the range of a recent
# server core (private L1d and L2, one slice-equivalent of shared L3).
# Numbers are illustrative, not a model of any specific product.

[L1d]
size     = 32K
block    = 64
assoc    = 8
policy   = plru        # real L1s use tree pseudo-LRU
write    = write-back
allocate = yes
latency  = 4

[L2]
size     = 1M
block    = 64
assoc    = 16
policy   = plru
latency  = 14

[L3]
size     = 8M
block    = 64
assoc    = 16
policy   = srrip       # scan-resistant policy, as in RRIP-style LLCs
latency  = 42

[memory]
latency  = 200
