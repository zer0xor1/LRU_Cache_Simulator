<text x="24.0" y="32.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600" >Replacement policies: miss rate on an 8 KiB, 4-way cache</text>
<text x="24.0" y="52.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >OPT (Belady) is the lower bound. Shorter is better.</text>
<text x="24.0" y="94.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >Loop 25% larger than cache</text>
<text x="24.0" y="110.0" font-size="11" fill="#6f6d68" text-anchor="start" font-weight="400" >10 KiB array scanned 50 times</text>
