<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Replacement policies: miss rate on an 8 KiB, 4-way cache</title><desc id="d">Four small bar charts comparing LRU, FIFO, Random, tree PLRU, SRRIP and OPT miss rates. LRU thrashes on a loop slightly larger than the cache; SRRIP wins on hot/cold data. Data in docs/data/policies.csv.</desc>
