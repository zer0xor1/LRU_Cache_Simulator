<title id="t">Matrix multiply 64x64 (doubles): same math, very different miss rates</title><desc id="d">Line chart, log scale: naive i-j-k matrix multiply misses about 50% until the cache holds a full matrix; i-k-j order misses about 4%; 8x8 tiling about 1%. Data in docs/data/matmul_tiling.csv.</desc>
